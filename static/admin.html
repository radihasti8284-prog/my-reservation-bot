<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M4Cut - پنل مدیریت</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        /* استایل‌های قبلی + موارد جدید */
        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--luxe-border);
        }
        .setting-item .label { color: var(--luxe-text-muted); }
        .setting-item .value { color: var(--luxe-text); font-weight: 500; }
        .setting-item input {
            background: var(--luxe-bg);
            border: 1px solid var(--luxe-border);
            border-radius: 10px;
            padding: 8px 12px;
            color: var(--luxe-text);
            font-family: inherit;
            width: 200px;
        }
        .setting-item input:focus { border-color: var(--luxe-gold); }
        .btn-sm {
            padding: 6px 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            font-size: 13px;
        }
        .btn-sm-primary { background: var(--luxe-gold); color: #0A0E17; }
        .btn-sm-danger { background: var(--luxe-danger); color: white; }
        .btn-sm-success { background: var(--luxe-success); color: white; }
        .btn-sm-primary:hover { background: var(--luxe-gold-light); }
        .user-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .capacity-badge {
            background: var(--luxe-gold);
            color: #0A0E17;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }
        .search-box input, .search-box select {
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid var(--luxe-border);
            background: var(--luxe-bg);
            color: var(--luxe-text);
            font-family: inherit;
            flex: 1;
            min-width: 100px;
        }
        .search-box input:focus, .search-box select:focus { border-color: var(--luxe-gold); }
    </style>
</head>
<body>
<div class="container">
    <div class="brand-header">
        <div class="brand-logo">M4<span>Cut</span></div>
        <div class="brand-tagline">📊 پنل مدیریت</div>
    </div>

    <div class="tabs">
        <button class="active" data-tab="stats">📊 آمار</button>
        <button data-tab="apps">📋 نوبت‌ها</button>
        <button data-tab="users">👥 کاربران</button>
        <button data-tab="schedule">⏰ ساعات کاری</button>
        <button data-tab="settings">⚙️ تنظیمات</button>
        <button data-tab="broadcast">📢 اعلان</button>
    </div>

    <!-- آمار -->
    <div id="tab-stats" class="tab-content active">...</div>

    <!-- نوبت‌ها -->
    <div id="tab-apps" class="tab-content">
        <div class="search-box">
            <select id="filterStatus">
                <option value="">همه وضعیت‌ها</option>
                <option value="pending">در انتظار</option>
                <option value="confirmed">تأیید شده</option>
                <option value="completed">انجام شده</option>
                <option value="cancelled">لغو شده</option>
            </select>
            <input type="text" id="filterUser" placeholder="آیدی کاربر...">
            <input type="text" id="filterDate" placeholder="تاریخ (مثلاً 1404/05/20)...">
            <button class="btn-sm btn-sm-primary" onclick="applyFilters()">فیلتر</button>
            <button class="btn-sm btn-sm-primary" onclick="exportExcel()">📤 خروجی اکسل</button>
        </div>
        <div id="appointmentsList"></div>
    </div>

    <!-- کاربران -->
    <div id="tab-users" class="tab-content">
        <div id="usersList"></div>
    </div>

    <!-- ساعات کاری -->
    <div id="tab-schedule" class="tab-content">
        <div id="scheduleList"></div>
        <button id="saveSchedule" class="btn btn-success" style="margin-top:12px;">💾 ذخیره تنظیمات</button>
    </div>

    <!-- تنظیمات -->
    <div id="tab-settings" class="tab-content">
        <div class="setting-item">
            <span class="label">📞 شماره پشتیبانی (ادمین)</span>
            <div>
                <input type="text" id="supportInput" value="@Tvpnred">
                <button class="btn-sm btn-sm-primary" onclick="updateSupport()">ذخیره</button>
            </div>
        </div>
        <div style="font-size:12px;color:var(--luxe-text-muted);margin-top:8px;">
            این شماره در پیام استارت و لندینگ نمایش داده می‌شود.
        </div>
    </div>

    <!-- اعلان همگانی -->
    <div id="tab-broadcast" class="tab-content">
        <div class="broadcast-area">
            <textarea id="broadcastMessage" placeholder="متن پیام همگانی..."></textarea>
            <button id="sendBroadcast" class="btn btn-success">📤 ارسال</button>
            <div id="broadcastResult"></div>
        </div>
    </div>

    <button onclick="Telegram.WebApp.close()" class="btn btn-close">❌ بستن</button>
</div>

<script>
    const user = JSON.parse(localStorage.getItem('user'));
    if (!user || user.is_admin !== 1) window.location.href = '/static/index.html';

    // ====== تب‌ها ======
    document.querySelectorAll('.tabs button').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + this.dataset.tab).classList.add('active');
            if (this.dataset.tab === 'stats') loadStats();
            if (this.dataset.tab === 'apps') loadAppointments();
            if (this.dataset.tab === 'users') loadUsers();
            if (this.dataset.tab === 'schedule') loadSchedule();
            if (this.dataset.tab === 'settings') loadSupport();
        });
    });

    // ====== آمار ======
    async function loadStats() {
        const res = await fetch('/api/admin/stats');
        const data = await res.json();
        if (data.status === 'ok') {
            const s = data.stats;
            document.getElementById('statUsers').textContent = s.total_users;
            document.getElementById('statTotalApps').textContent = s.total_appointments;
            document.getElementById('statTodayApps').textContent = s.today_appointments;
            document.getElementById('statUpcomingApps').textContent = s.upcoming_appointments;
            document.getElementById('statPending').textContent = s.status.pending;
            document.getElementById('statConfirmed').textContent = s.status.confirmed;
            document.getElementById('statCompleted').textContent = s.status.completed;
            document.getElementById('statCancelled').textContent = s.status.cancelled;
        }
    }

    // ====== نوبت‌ها ======
    async function loadAppointments(filters = {}) {
        let url = '/api/admin/appointments?';
        if (filters.status) url += `status=${filters.status}&`;
        if (filters.user) url += `user=${filters.user}&`;
        if (filters.date) url += `date=${filters.date}&`;

        const res = await fetch(url);
        const data = await res.json();
        const div = document.getElementById('appointmentsList');
        if (!data.appointments || data.appointments.length === 0) {
            div.innerHTML = '<p style="color:var(--luxe-text-muted);text-align:center;padding:20px;">هیچ نوبتی یافت نشد.</p>';
            return;
        }
        div.innerHTML = data.appointments.map(a => `
            <div class="admin-box ${a.status}">
                <strong>${a.service_name}</strong><br>
                👤 ${a.user_name} | 📞 ${a.phone} | 🆔 ${a.telegram_id}<br>
                📅 ${a.appointment_date} | 🕐 ${a.appointment_time}<br>
                وضعیت: <span class="status-badge ${a.status}">${a.status === 'pending' ? 'در انتظار' : a.status === 'confirmed' ? 'تأیید شده' : a.status === 'cancelled' ? 'لغو شده' : 'انجام شده'}</span>
                ${a.receipt ? `<br><img src="${a.receipt}" class="receipt-thumb" onclick="window.open('${a.receipt}')" />` : ''}
                <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
                    <select onchange="updateStatus(${a.id}, this.value)">
                        <option value="pending" ${a.status === 'pending' ? 'selected' : ''}>در انتظار</option>
                        <option value="confirmed" ${a.status === 'confirmed' ? 'selected' : ''}>تأیید شده</option>
                        <option value="completed" ${a.status === 'completed' ? 'selected' : ''}>انجام شده</option>
                        <option value="cancelled" ${a.status === 'cancelled' ? 'selected' : ''}>لغو شده</option>
                    </select>
                    ${a.status === 'pending' ? `<button class="btn-sm btn-sm-success" onclick="quickApprove(${a.id})">✔️ تأیید</button>` : ''}
                </div>
            </div>
        `).join('');
    }

    function applyFilters() {
        const status = document.getElementById('filterStatus').value;
        const user = document.getElementById('filterUser').value;
        const date = document.getElementById('filterDate').value;
        loadAppointments({ status, user, date });
    }

    async function updateStatus(id, status) {
        const res = await fetch(`/api/admin/appointments/${id}/status`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({status})
        });
        const result = await res.json();
        alert(result.message);
        applyFilters();
        loadStats();
    }

    async function quickApprove(id) {
        if (!confirm('تأیید نوبت؟')) return;
        await updateStatus(id, 'confirmed');
    }

    function exportExcel() {
        window.open('/api/admin/export/excel', '_blank');
    }

    // ====== کاربران ======
    async function loadUsers() {
        const res = await fetch('/api/admin/users');
        const data = await res.json();
        const div = document.getElementById('usersList');
        if (!data.users || data.users.length === 0) {
            div.innerHTML = '<p style="color:var(--luxe-text-muted);text-align:center;padding:20px;">هیچ کاربری ثبت نشده است.</p>';
            return;
        }
        div.innerHTML = data.users.map(u => `
            <div class="user-item">
                <div>
                    <strong>${u.name}</strong> | 📞 ${u.phone || '---'} | 🆔 ${u.telegram_id}
                    ${u.is_admin === 1 ? '<span class="admin-badge">👑 ادمین</span>' : ''}
                </div>
                <div class="user-actions">
                    <button class="btn-sm btn-sm-primary" onclick="toggleAdmin(${u.telegram_id}, ${u.is_admin === 1 ? 0 : 1})">
                        ${u.is_admin === 1 ? '⬇️ حذف ادمین' : '⬆️ ادمین کن'}
                    </button>
                    <button class="btn-sm btn-sm-danger" onclick="deleteUser(${u.telegram_id})">🗑️</button>
                </div>
            </div>
        `).join('');
    }

    async function toggleAdmin(telegram_id, newStatus) {
        if (!confirm('تغییر نقش کاربر؟')) return;
        await fetch(`/api/admin/users/${telegram_id}`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({is_admin: newStatus})
        });
        loadUsers();
    }

    async function deleteUser(telegram_id) {
        if (!confirm('حذف کاربر؟')) return;
        await fetch(`/api/admin/users/${telegram_id}`, {method: 'DELETE'});
        loadUsers();
    }

    // ====== ساعات کاری ======
    async function loadSchedule() {
        const res = await fetch('/api/admin/schedule');
        const data = await res.json();
        const div = document.getElementById('scheduleList');
        const days = ['شنبه', 'یکشنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنجشنبه', 'جمعه'];
        div.innerHTML = data.schedule.map(s => `
            <div class="schedule-item">
                <span class="day-name">${days[s.day_of_week]}</span>
                <input type="time" value="${s.start_time}" data-day="${s.day_of_week}" class="start-time">
                <span>تا</span>
                <input type="time" value="${s.end_time}" data-day="${s.day_of_week}" class="end-time">
                <span>ظرفیت: <input type="number" value="${s.capacity}" data-day="${s.day_of_week}" class="capacity-input" style="width:50px;padding:4px;border-radius:8px;border:1px solid var(--luxe-border);background:var(--luxe-bg);color:var(--luxe-text);"></span>
                <label>
                    <input type="checkbox" ${s.is_active === 1 ? 'checked' : ''} data-day="${s.day_of_week}" class="active-check">
                    فعال
                </label>
            </div>
        `).join('');
    }

    document.getElementById('saveSchedule').addEventListener('click', async function() {
        const items = document.querySelectorAll('.schedule-item');
        const updates = [];
        items.forEach(item => {
            const day = parseInt(item.querySelector('.start-time').dataset.day);
            const start = item.querySelector('.start-time').value;
            const end = item.querySelector('.end-time').value;
            const capacity = parseInt(item.querySelector('.capacity-input').value) || 2;
            const active = item.querySelector('.active-check').checked ? 1 : 0;
            updates.push({ day_of_week: day, start_time: start, end_time: end, capacity, is_active: active });
        });
        for (const update of updates) {
            await fetch('/api/admin/schedule', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(update)
            });
        }
        alert('✅ ساعات کاری ذخیره شد!');
        loadSchedule();
    });

    // ====== تنظیمات پشتیبانی ======
    async function loadSupport() {
        const res = await fetch('/api/admin/support');
        const data = await res.json();
        document.getElementById('supportInput').value = data.support_contact || '@Tvpnred';
    }

    async function updateSupport() {
        const value = document.getElementById('supportInput').value.trim();
        if (!value) {
            alert('لطفاً مقدار را وارد کنید.');
            return;
        }
        await fetch('/api/admin/support', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({support_contact: value})
        });
        alert('✅ شماره پشتیبانی به‌روزرسانی شد!');
    }

    // ====== اعلان همگانی ======
    document.getElementById('sendBroadcast').addEventListener('click', async function() {
        const message = document.getElementById('broadcastMessage').value.trim();
        if (!message) { alert('متن پیام را وارد کنید.'); return; }
        if (!confirm(`ارسال پیام:\n\n${message}`)) return;
        const res = await fetch('/api/admin/broadcast', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({message})
        });
        const result = await res.json();
        document.getElementById('broadcastResult').innerHTML = `<div class="msg msg-success">✅ ${result.message}</div>`;
        document.getElementById('broadcastMessage').value = '';
    });

    // بارگیری اولیه
    loadStats();
    loadAppointments();
</script>
</body>
</html>
