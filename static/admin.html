<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>M4Cut - پنل مدیریت</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .search-box {
            display: flex;
            gap: 6px;
            margin-bottom: 0.75rem;
            flex-wrap: wrap;
        }
        .search-box input, .search-box select {
            flex: 1 1 auto;
            min-width: 70px;
            padding: 0.5rem 0.6rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--luxe-border);
            background: var(--luxe-bg);
            color: var(--luxe-text);
            font-family: inherit;
            font-size: clamp(0.7rem, 1.8vw, 0.85rem);
            min-height: 36px;
        }
        .search-box input:focus, .search-box select:focus {
            border-color: var(--luxe-gold);
            outline: none;
        }
        .search-box .btn-sm {
            flex: 0 1 auto;
            min-width: 50px;
        }
        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.6rem 0;
            border-bottom: 1px solid var(--luxe-border);
            flex-wrap: wrap;
            gap: 6px;
        }
        .setting-item .label {
            color: var(--luxe-text-muted);
            font-size: clamp(0.75rem, 2vw, 0.9rem);
        }
        .setting-item input {
            background: var(--luxe-bg);
            border: 1px solid var(--luxe-border);
            border-radius: var(--radius-sm);
            padding: 0.4rem 0.6rem;
            color: var(--luxe-text);
            font-family: inherit;
            width: 180px;
            min-height: 34px;
            font-size: clamp(0.75rem, 2vw, 0.9rem);
        }
        .setting-item input:focus {
            border-color: var(--luxe-gold);
            outline: none;
        }
        .broadcast-area {
            background: var(--luxe-bg);
            padding: 1rem;
            border-radius: var(--radius);
            border: 1px solid var(--luxe-border);
        }
        .broadcast-area textarea {
            min-height: 60px;
            resize: vertical;
            width: 100%;
            padding: 0.7rem 0.9rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--luxe-border);
            background: var(--luxe-bg);
            color: var(--luxe-text);
            font-family: inherit;
            font-size: clamp(0.75rem, 2vw, 0.9rem);
        }
        .broadcast-area textarea:focus {
            border-color: var(--luxe-gold);
            outline: none;
        }

        @media (max-width: 400px) {
            .search-box input, .search-box select {
                min-width: 50px;
                font-size: clamp(0.6rem, 1.5vw, 0.7rem);
                padding: 0.3rem 0.4rem;
                min-height: 30px;
            }
            .setting-item input {
                width: 120px;
                font-size: clamp(0.65rem, 1.6vw, 0.75rem);
                min-height: 28px;
            }
        }

        @media (max-width: 350px) {
            .search-box {
                flex-direction: column;
                gap: 4px;
            }
            .search-box input, .search-box select {
                width: 100%;
                min-width: unset;
            }
            .search-box .btn-sm {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="brand-header">
        <div class="brand-logo">M4<span>Cut</span></div>
        <div class="brand-tagline">📊 پنل مدیریت</div>
    </div>

    <div class="tabs">
        <button class="active" data-tab="stats">📊 آمار</button>
        <button data-tab="apps">📋 نوبت‌ها</button>
        <button data-tab="users">👥 کاربران</button>
        <button data-tab="schedule">⏰ ساعات</button>
        <button data-tab="settings">⚙️ تنظیمات</button>
        <button data-tab="broadcast">📢 اعلان</button>
    </div>

    <!-- آمار -->
    <div id="tab-stats" class="tab-content active">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;">
            <span style="font-weight:600;font-size:clamp(0.85rem,2.2vw,1rem);">📊 آمار کلی</span>
            <button class="btn-sm btn-sm-primary" onclick="loadStats()" style="padding:0.3rem 0.8rem;">⟳ بروزرسانی</button>
        </div>
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card gold"><span class="number" id="statUsers">...</span><span class="label">👥 کاربران</span></div>
            <div class="stat-card gold"><span class="number" id="statTotalApps">...</span><span class="label">📋 کل نوبت‌ها</span></div>
            <div class="stat-card"><span class="number" id="statTodayApps">...</span><span class="label">📅 نوبت‌های امروز</span></div>
            <div class="stat-card"><span class="number" id="statUpcomingApps">...</span><span class="label">📆 نوبت‌های آینده</span></div>
        </div>
        <div class="stats-detail">
            <div class="row"><span class="label">⏳ در انتظار</span><span class="value" id="statPending">...</span></div>
            <div class="row"><span class="label">✅ تأیید شده</span><span class="value" id="statConfirmed">...</span></div>
            <div class="row"><span class="label">✔️ انجام شده</span><span class="value" id="statCompleted">...</span></div>
            <div class="row"><span class="label">❌ لغو شده</span><span class="value" id="statCancelled">...</span></div>
        </div>
        <div class="footer-note" style="margin-top:0.3rem;">🔄 هر بار ورود بروزرسانی می‌شود</div>
    </div>

    <!-- نوبت‌ها -->
    <div id="tab-apps" class="tab-content">
        <div class="search-box">
            <select id="filterStatus"><option value="">همه</option><option value="pending">در انتظار</option><option value="confirmed">تأیید</option><option value="completed">انجام</option><option value="cancelled">لغو</option></select>
            <input type="text" id="filterUser" placeholder="آیدی کاربر...">
            <input type="text" id="filterDate" placeholder="تاریخ...">
            <button class="btn-sm btn-sm-primary" onclick="applyFilters()">🔍 فیلتر</button>
            <button class="btn-sm btn-sm-primary" onclick="exportExcel()">📤 اکسل</button>
        </div>
        <div id="appointmentsList"></div>
    </div>

    <!-- کاربران -->
    <div id="tab-users" class="tab-content">
        <div id="usersList"></div>
    </div>

    <!-- ساعات کاری -->
    <div id="tab-schedule" class="tab-content">
        <div id="scheduleList"></div>
        <button id="saveSchedule" class="btn btn-success" style="margin-top:0.75rem;">💾 ذخیره</button>
    </div>

    <!-- تنظیمات -->
    <div id="tab-settings" class="tab-content">
        <div class="setting-item">
            <span class="label">📞 پشتیبانی</span>
            <div style="display:flex;gap:4px;flex-wrap:wrap;">
                <input type="text" id="supportInput" value="@Tvpnred">
                <button class="btn-sm btn-sm-primary" onclick="updateSupport()">ذخیره</button>
            </div>
        </div>
    </div>

    <!-- اعلان همگانی -->
    <div id="tab-broadcast" class="tab-content">
        <div class="broadcast-area">
            <textarea id="broadcastMessage" placeholder="متن پیام همگانی..."></textarea>
            <button id="sendBroadcast" class="btn btn-success" style="margin-top:0.5rem;">📤 ارسال</button>
            <div id="broadcastResult"></div>
        </div>
    </div>

    <button onclick="Telegram.WebApp.close()" class="btn btn-close">❌ بستن</button>
</div>

<script>
    const user = JSON.parse(localStorage.getItem('user'));
    if (!user || user.is_admin !== 1) window.location.href = '/static/index.html';

    // ====== تب‌ها ======
    document.querySelectorAll('.tabs button').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + this.dataset.tab).classList.add('active');
            if (this.dataset.tab === 'stats') loadStats();
            if (this.dataset.tab === 'apps') loadAppointments();
            if (this.dataset.tab === 'users') loadUsers();
            if (this.dataset.tab === 'schedule') loadSchedule();
            if (this.dataset.tab === 'settings') loadSupport();
        });
    });

    // ====== آمار ======
    async function loadStats() {
        try {
            const res = await fetch('/api/admin/stats');
            const data = await res.json();
            if (data.status === 'ok') {
                const s = data.stats;
                document.getElementById('statUsers').textContent = s.total_users;
                document.getElementById('statTotalApps').textContent = s.total_appointments;
                document.getElementById('statTodayApps').textContent = s.today_appointments;
                document.getElementById('statUpcomingApps').textContent = s.upcoming_appointments;
                document.getElementById('statPending').textContent = s.status.pending;
                document.getElementById('statConfirmed').textContent = s.status.confirmed;
                document.getElementById('statCompleted').textContent = s.status.completed;
                document.getElementById('statCancelled').textContent = s.status.cancelled;
            }
        } catch(e) {}
    }

    // ====== نوبت‌ها ======
    async function loadAppointments(filters = {}) {
        try {
            let url = '/api/admin/appointments?';
            if (filters.status) url += `status=${filters.status}&`;
            if (filters.user) url += `user=${filters.user}&`;
            if (filters.date) url += `date=${filters.date}&`;
            const res = await fetch(url);
            const data = await res.json();
            const div = document.getElementById('appointmentsList');
            if (!data.appointments || data.appointments.length === 0) {
                div.innerHTML = '<p style="color:var(--luxe-text-muted);text-align:center;padding:1rem;">هیچ نوبتی یافت نشد.</p>';
                return;
            }
            div.innerHTML = data.appointments.map(a => `
                <div class="admin-box ${a.status}">
                    <strong>${a.service_name}</strong><br>
                    👤 ${a.user_name} | 📞 ${a.phone} | 🆔 ${a.telegram_id}<br>
                    📅 ${a.appointment_date} | 🕐 ${a.appointment_time}<br>
                    وضعیت: <span class="status-badge ${a.status}">${a.status === 'pending' ? 'در انتظار' : a.status === 'confirmed' ? 'تأیید شده' : a.status === 'cancelled' ? 'لغو شده' : 'انجام شده'}</span>
                    ${a.receipt ? `<br><img src="${a.receipt}" class="receipt-thumb" onclick="window.open('${a.receipt}')" />` : ''}
                    <div style="margin-top:8px;display:flex;gap:4px;flex-wrap:wrap;align-items:center;">
                        <select onchange="updateStatus(${a.id}, this.value)" style="padding:0.3rem 0.5rem;border-radius:var(--radius-sm);border:1px solid var(--luxe-border);background:var(--luxe-bg);color:var(--luxe-text);font-family:inherit;font-size:clamp(0.65rem,1.6vw,0.75rem);min-height:30px;">
                            <option value="pending" ${a.status === 'pending' ? 'selected' : ''}>در انتظار</option>
                            <option value="confirmed" ${a.status === 'confirmed' ? 'selected' : ''}>تأیید</option>
                            <option value="completed" ${a.status === 'completed' ? 'selected' : ''}>انجام</option>
                            <option value="cancelled" ${a.status === 'cancelled' ? 'selected' : ''}>لغو</option>
                        </select>
                        ${a.status === 'pending' ? `<button class="btn-sm btn-sm-success" onclick="quickApprove(${a.id})">✔️ تأیید</button>` : ''}
                    </div>
                </div>
            `).join('');
        } catch(e) {}
    }

    function applyFilters() {
        const status = document.getElementById('filterStatus').value;
        const user = document.getElementById('filterUser').value;
        const date = document.getElementById('filterDate').value;
        loadAppointments({ status, user, date });
    }

    async function updateStatus(id, status) {
        try {
            const res = await fetch(`/api/admin/appointments/${id}/status`, {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({status})
            });
            const result = await res.json();
            alert(result.message);
            applyFilters();
            loadStats();
        } catch(e) { alert('خطا!'); }
    }

    async function quickApprove(id) {
        if (!confirm('تأیید نوبت؟')) return;
        await updateStatus(id, 'confirmed');
    }

    function exportExcel() {
        window.open('/api/admin/export/excel', '_blank');
    }

    // ====== کاربران ======
    async function loadUsers() {
        try {
            const res = await fetch('/api/admin/users');
            const data = await res.json();
            const div = document.getElementById('usersList');
            if (!data.users || data.users.length === 0) {
                div.innerHTML = '<p style="color:var(--luxe-text-muted);text-align:center;padding:1rem;">هیچ کاربری ثبت نشده است.</p>';
                return;
            }
            div.innerHTML = data.users.map(u => `
                <div class="user-item">
                    <div style="font-size:clamp(0.7rem,1.8vw,0.85rem);">
                        <strong>${u.name}</strong> | 📞 ${u.phone || '---'} | 🆔 ${u.telegram_id}
                        ${u.is_admin === 1 ? '<span class="admin-badge">👑 ادمین</span>' : ''}
                    </div>
                    <div style="display:flex;gap:4px;flex-wrap:wrap;">
                        <button class="btn-sm btn-sm-primary" onclick="toggleAdmin(${u.telegram_id}, ${u.is_admin === 1 ? 0 : 1})">${u.is_admin === 1 ? '⬇️' : '⬆️'}</button>
                        <button class="btn-sm btn-sm-danger" onclick="deleteUser(${u.telegram_id})">🗑️</button>
                    </div>
                </div>
            `).join('');
        } catch(e) {}
    }

    async function toggleAdmin(id, newStatus) {
        if (!confirm('تغییر نقش؟')) return;
        try {
            await fetch(`/api/admin/users/${id}`, {
                method:'PUT',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({is_admin:newStatus})
            });
            loadUsers();
        } catch(e) { alert('خطا!'); }
    }

    async function deleteUser(id) {
        if (!confirm('حذف کاربر؟')) return;
        try {
            await fetch(`/api/admin/users/${id}`, { method:'DELETE' });
            loadUsers();
        } catch(e) { alert('خطا!'); }
    }

    // ====== ساعات کاری ======
    async function loadSchedule() {
        try {
            const res = await fetch('/api/admin/schedule');
            const data = await res.json();
            const div = document.getElementById('scheduleList');
            const days = ['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
            div.innerHTML = data.schedule.map(s => `
                <div class="schedule-item">
                    <span class="day-name">${days[s.day_of_week]}</span>
                    <input type="time" value="${s.start_time}" data-day="${s.day_of_week}" class="start-time">
                    <span>تا</span>
                    <input type="time" value="${s.end_time}" data-day="${s.day_of_week}" class="end-time">
                    <span>ظرفیت: <input type="number" value="${s.capacity}" data-day="${s.day_of_week}" class="capacity-input"></span>
                    <label><input type="checkbox" ${s.is_active === 1 ? 'checked' : ''} data-day="${s.day_of_week}" class="active-check"> فعال</label>
                </div>
            `).join('');
        } catch(e) {}
    }

    document.getElementById('saveSchedule').addEventListener('click', async function() {
        const items = document.querySelectorAll('.schedule-item');
        const updates = [];
        items.forEach(item => {
            const day = parseInt(item.querySelector('.start-time').dataset.day);
            const start = item.querySelector('.start-time').value;
            const end = item.querySelector('.end-time').value;
            const cap = parseInt(item.querySelector('.capacity-input').value) || 2;
            const active = item.querySelector('.active-check').checked ? 1 : 0;
            updates.push({ day_of_week: day, start_time: start, end_time: end, capacity: cap, is_active: active });
        });
        for (const u of updates) {
            await fetch('/api/admin/schedule', {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify(u)
            });
        }
        alert('✅ ذخیره شد!');
        loadSchedule();
    });

    // ====== تنظیمات پشتیبانی ======
    async function loadSupport() {
        try {
            const res = await fetch('/api/admin/support');
            const data = await res.json();
            document.getElementById('supportInput').value = data.support_contact || '@Tvpnred';
        } catch(e) {}
    }

    async function updateSupport() {
        const val = document.getElementById('supportInput').value.trim();
        if (!val) { alert('مقدار را وارد کنید.'); return; }
        try {
            await fetch('/api/admin/support', {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({support_contact:val})
            });
            alert('✅ ذخیره شد!');
        } catch(e) { alert('خطا!'); }
    }

    // ====== اعلان همگانی ======
    document.getElementById('sendBroadcast').addEventListener('click', async function() {
        const msg = document.getElementById('broadcastMessage').value.trim();
        if (!msg) { alert('متن را وارد کنید.'); return; }
        if (!confirm(`ارسال:\n\n${msg}`)) return;
        try {
            const res = await fetch('/api/admin/broadcast', {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body:JSON.stringify({message:msg})
            });
            const result = await res.json();
            document.getElementById('broadcastResult').innerHTML = `<div class="msg msg-success">✅ ${result.message}</div>`;
            document.getElementById('broadcastMessage').value = '';
        } catch(e) { alert('خطا!'); }
    });

    // بارگیری اولیه
    loadStats();
    loadAppointments();
</script>
</body>
</html>
