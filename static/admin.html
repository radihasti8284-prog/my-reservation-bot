<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M4Cut - پنل مدیریت</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ====== استایل‌های اختصاصی ادمین ====== */
        .admin-box {
            background: var(--luxe-bg);
            padding: 16px 18px;
            border-radius: 16px;
            margin: 10px 0;
            border-right: 4px solid var(--luxe-gold);
            border-left: 1px solid var(--luxe-border);
            border-top: 1px solid var(--luxe-border);
            border-bottom: 1px solid var(--luxe-border);
            transition: all 0.3s ease;
        }
        .admin-box:hover { border-color: var(--luxe-border-light); }
        .admin-box.confirmed { border-right-color: var(--luxe-success); }
        .admin-box.cancelled { border-right-color: var(--luxe-danger); }
        .admin-box.completed { border-right-color: var(--luxe-text-muted); }
        .admin-box .receipt-thumb {
            max-width: 70px; max-height: 70px; border-radius: 10px;
            cursor: pointer; border: 1px solid var(--luxe-border);
            transition: all 0.3s ease;
        }
        .admin-box .receipt-thumb:hover { transform: scale(1.05); border-color: var(--luxe-gold); }
        .btn-sm {
            padding: 8px 16px;
            font-size: 13px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-sm-success { background: var(--luxe-success); color: white; }
        .btn-sm-success:hover { background: #3CA06A; box-shadow: 0 4px 15px rgba(46, 139, 87, 0.3); }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin: 12px 0 16px;
        }
        .stat-card {
            background: var(--luxe-bg);
            padding: 16px 14px;
            border-radius: 16px;
            text-align: center;
            border: 1px solid var(--luxe-border);
            transition: all 0.3s ease;
        }
        .stat-card:hover { border-color: var(--luxe-gold-dark); }
        .stat-card .number {
            font-size: 30px; font-weight: 800;
            color: var(--luxe-gold);
            display: block;
            letter-spacing: -0.5px;
        }
        .stat-card .label {
            font-size: 12px; color: var(--luxe-text-muted);
            margin-top: 4px; display: block; font-weight: 500;
        }
        .stat-card.gold { background: var(--luxe-gold); border-color: var(--luxe-gold); }
        .stat-card.gold .number, .stat-card.gold .label { color: #0A0E17; }
        .status-badge {
            display: inline-block;
            padding: 3px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .status-badge.pending { background: rgba(212, 184, 124, 0.2); color: var(--luxe-gold); }
        .status-badge.confirmed { background: rgba(46, 139, 87, 0.2); color: var(--luxe-success); }
        .status-badge.cancelled { background: rgba(178, 34, 52, 0.2); color: var(--luxe-danger); }
        .status-badge.completed { background: rgba(154, 165, 181, 0.2); color: var(--luxe-text-muted); }
        .stats-detail {
            background: var(--luxe-bg);
            border-radius: 16px;
            padding: 16px 18px;
            margin: 4px 0 12px;
            border: 1px solid var(--luxe-border);
        }
        .stats-detail .row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 14px;
            border-bottom: 1px solid var(--luxe-border);
        }
        .stats-detail .row:last-child { border-bottom: none; }
        .stats-detail .row .label { color: var(--luxe-text-muted); }
        .stats-detail .row .value { font-weight: 600; color: var(--luxe-text); }
        .stats-note {
            font-size: 12px;
            color: var(--luxe-text-muted);
            text-align: center;
            margin: 8px 0 4px;
            opacity: 0.6;
        }
        .refresh-btn {
            background: none;
            border: none;
            color: var(--luxe-gold);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            transition: all 0.3s ease;
        }
        .refresh-btn:hover { color: var(--luxe-gold-light); }
        .broadcast-area {
            background: var(--luxe-bg);
            padding: 18px 20px;
            border-radius: 16px;
            margin: 10px 0;
            border: 1px solid var(--luxe-border);
        }
        .broadcast-area textarea {
            min-height: 80px;
            resize: vertical;
            width: 100%;
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px solid var(--luxe-border);
            background: var(--luxe-bg);
            color: var(--luxe-text);
            font-family: inherit;
            font-size: 14px;
        }
        .broadcast-area textarea:focus { border-color: var(--luxe-gold); }
        .schedule-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--luxe-border);
            flex-wrap: wrap;
        }
        .schedule-item .day-name {
            width: 70px;
            font-weight: 600;
            color: var(--luxe-text);
            font-size: 14px;
        }
        .schedule-item input[type="time"] {
            width: 100px;
            padding: 6px 10px;
            border-radius: 10px;
            border: 1px solid var(--luxe-border);
            background: var(--luxe-bg);
            color: var(--luxe-text);
            font-family: inherit;
            margin: 0;
        }
        .schedule-item input[type="time"]:focus { border-color: var(--luxe-gold); }
        .schedule-item label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 400;
            color: var(--luxe-text-muted);
            margin: 0;
        }
        .schedule-item input[type="checkbox"] {
            width: 18px; height: 18px;
            accent-color: var(--luxe-gold);
            margin: 0;
        }
        .user-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            background: var(--luxe-bg);
            border-radius: 14px;
            margin: 6px 0;
            border: 1px solid var(--luxe-border);
            transition: all 0.3s ease;
        }
        .user-item:hover { border-color: var(--luxe-border-light); }
        .user-item .admin-badge {
            background: var(--luxe-gold);
            color: #0A0E17;
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }
        .tabs {
            display: flex;
            gap: 6px;
            margin: 16px 0 20px;
            background: var(--luxe-bg);
            border-radius: 16px;
            padding: 4px;
            border: 1px solid var(--luxe-border);
        }
        .tabs button {
            flex: 1;
            padding: 10px 8px;
            border: none;
            border-radius: 12px;
            background: transparent;
            color: var(--luxe-text-muted);
            font-size: 13px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .tabs button.active {
            background: var(--luxe-gold);
            color: #0A0E17;
            box-shadow: 0 4px 12px rgba(212, 184, 124, 0.2);
        }
        .tabs button:hover:not(.active) { color: var(--luxe-text); }
        .tab-content { display: none; animation: fadeSlide 0.4s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeSlide { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .msg { padding: 14px 18px; border-radius: 14px; margin: 12px 0; font-size: 14px; font-weight: 500; border-right: 4px solid transparent; }
        .msg-success { background: rgba(46, 139, 87, 0.12); color: var(--luxe-success); border-right-color: var(--luxe-success); }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            text-align: center;
            letter-spacing: 0.3px;
            background: var(--luxe-gold);
            color: #0A0E17;
            box-shadow: 0 4px 15px rgba(212, 184, 124, 0.25);
        }
        .btn:hover {
            background: var(--luxe-gold-light);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(212, 184, 124, 0.35);
        }
        .btn-success { background: var(--luxe-success); color: white; box-shadow: 0 4px 15px rgba(46, 139, 87, 0.3); }
        .btn-success:hover { background: #3CA06A; box-shadow: 0 8px 30px rgba(46, 139, 87, 0.4); }
        .btn-close {
            background: transparent;
            color: var(--luxe-text-muted);
            border: 1px solid var(--luxe-border);
            box-shadow: none;
            margin-top: 16px;
        }
        .btn-close:hover {
            background: var(--luxe-border);
            color: var(--luxe-text);
            box-shadow: none;
            transform: none;
        }
        .container {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            background: var(--luxe-card);
            border-radius: 28px;
            padding: 32px 24px;
            box-shadow: var(--luxe-shadow), var(--luxe-glow);
            border: 1px solid var(--luxe-border);
        }
        .brand-header {
            text-align: center;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--luxe-border);
            margin-bottom: 24px;
        }
        .brand-logo { font-size: 36px; font-weight: 800; letter-spacing: -0.5px; color: var(--luxe-text); display: flex; justify-content: center; align-items: center; gap: 4px; }
        .brand-logo span { color: var(--luxe-gold); }
        .brand-tagline { font-size: 13px; color: var(--luxe-text-muted); margin-top: 6px; letter-spacing: 1px; font-weight: 300; }
        :root {
            --luxe-bg: #0A0E17;
            --luxe-card: #131B2A;
            --luxe-card-hover: #1A2438;
            --luxe-gold: #D4B87C;
            --luxe-gold-light: #E8C98A;
            --luxe-gold-dark: #B8995E;
            --luxe-text: #EAEAEA;
            --luxe-text-muted: #9AA5B5;
            --luxe-border: #1E2A3A;
            --luxe-border-light: #2A3A50;
            --luxe-success: #2E8B57;
            --luxe-danger: #B22234;
            --luxe-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            --luxe-glow: 0 0 20px rgba(212, 184, 124, 0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--luxe-bg);
            color: var(--luxe-text);
            font-family: 'IRANYekanXVF', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            direction: rtl;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        .notice-box {
            background: rgba(212, 184, 124, 0.06);
            padding: 12px 16px;
            border-radius: 12px;
            margin: 12px 0;
            text-align: center;
            font-size: 13px;
            color: var(--luxe-text-muted);
            border: 1px solid var(--luxe-border);
        }
        .notice-box strong { color: var(--luxe-gold); }
        select {
            padding: 6px 12px;
            border-radius: 10px;
            border: 1px solid var(--luxe-border);
            background: var(--luxe-bg);
            color: var(--luxe-text);
            font-family: inherit;
            font-size: 13px;
        }
        select:focus { border-color: var(--luxe-gold); outline: none; }
    </style>
</head>
<body>
<div class="container">
    <div class="brand-header">
        <div class="brand-logo">M4<span>Cut</span></div>
        <div class="brand-tagline">📊 پنل مدیریت</div>
    </div>

    <div class="tabs">
        <button class="active" data-tab="stats">📊 آمار</button>
        <button data-tab="apps">📋 نوبت‌ها</button>
        <button data-tab="users">👥 کاربران</button>
        <button data-tab="schedule">⏰ ساعات کاری</button>
        <button data-tab="broadcast">📢 اعلان</button>
    </div>

    <!-- ====== تب آمار ====== -->
    <div id="tab-stats" class="tab-content active">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
            <span style="font-weight:600;font-size:15px;color:var(--luxe-text);">📊 آمار کلی</span>
            <button class="refresh-btn" onclick="loadStats()">⟳ بروزرسانی</button>
        </div>
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card gold"><span class="number" id="statUsers">...</span><span class="label">👥 کاربران</span></div>
            <div class="stat-card gold"><span class="number" id="statTotalApps">...</span><span class="label">📋 کل نوبت‌ها</span></div>
            <div class="stat-card"><span class="number" id="statTodayApps">...</span><span class="label">📅 نوبت‌های امروز</span></div>
            <div class="stat-card"><span class="number" id="statUpcomingApps">...</span><span class="label">📆 نوبت‌های آینده</span></div>
        </div>
        <div class="stats-detail">
            <div class="row"><span class="label">⏳ در انتظار تأیید</span><span class="value" id="statPending">...</span></div>
            <div class="row"><span class="label">✅ تأیید شده</span><span class="value" id="statConfirmed">...</span></div>
            <div class="row"><span class="label">✔️ انجام شده</span><span class="value" id="statCompleted">...</span></div>
            <div class="row"><span class="label">❌ لغو شده</span><span class="value" id="statCancelled">...</span></div>
        </div>
        <div class="stats-note">🔄 آمار هر بار ورود به این صفحه بروزرسانی می‌شود</div>
    </div>

    <!-- ====== تب نوبت‌ها ====== -->
    <div id="tab-apps" class="tab-content">
        <div id="appointmentsList"></div>
    </div>

    <!-- ====== تب کاربران ====== -->
    <div id="tab-users" class="tab-content">
        <div id="usersList"></div>
    </div>

    <!-- ====== تب ساعات کاری ====== -->
    <div id="tab-schedule" class="tab-content">
        <div id="scheduleList"></div>
        <button id="saveSchedule" class="btn btn-success" style="margin-top:12px;">💾 ذخیره تنظیمات</button>
    </div>

    <!-- ====== تب اعلان همگانی ====== -->
    <div id="tab-broadcast" class="tab-content">
        <div class="broadcast-area">
            <label style="color:var(--luxe-text-muted);font-size:13px;font-weight:500;">متن پیام همگانی:</label>
            <textarea id="broadcastMessage" placeholder="متن پیام را وارد کنید..."></textarea>
            <button id="sendBroadcast" class="btn btn-success">📤 ارسال به همه کاربران</button>
            <div id="broadcastResult"></div>
        </div>
    </div>

    <div class="notice-box">
        ⚠️ تنها خدمت موجود: <strong>کوتاهی مو</strong> با بیعانه ۲۰۰,۰۰۰ تومان
    </div>

    <button onclick="Telegram.WebApp.close()" class="btn btn-close">❌ بستن</button>
</div>

<script>
    const user = JSON.parse(localStorage.getItem('user'));
    if (!user || user.is_admin !== 1) window.location.href = '/static/index.html';

    // ====== تب‌ها ======
    document.querySelectorAll('.tabs button').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + this.dataset.tab).classList.add('active');
            if (this.dataset.tab === 'stats') loadStats();
            if (this.dataset.tab === 'apps') loadAppointments();
            if (this.dataset.tab === 'users') loadUsers();
            if (this.dataset.tab === 'schedule') loadSchedule();
        });
    });

    // ====== آمار ======
    async function loadStats() {
        try {
            const res = await fetch('/api/admin/stats');
            const data = await res.json();
            if (data.status === 'ok') {
                const s = data.stats;
                document.getElementById('statUsers').textContent = s.total_users;
                document.getElementById('statTotalApps').textContent = s.total_appointments;
                document.getElementById('statTodayApps').textContent = s.today_appointments;
                document.getElementById('statUpcomingApps').textContent = s.upcoming_appointments;
                document.getElementById('statPending').textContent = s.status.pending;
                document.getElementById('statConfirmed').textContent = s.status.confirmed;
                document.getElementById('statCompleted').textContent = s.status.completed;
                document.getElementById('statCancelled').textContent = s.status.cancelled;
            }
        } catch(e) { console.error('Error loading stats:', e); }
    }

    // ====== نوبت‌ها ======
    async function loadAppointments() {
        const res = await fetch('/api/admin/appointments');
        const data = await res.json();
        const div = document.getElementById('appointmentsList');
        if (!data.appointments || data.appointments.length === 0) {
            div.innerHTML = '<p style="color:var(--luxe-text-muted);text-align:center;padding:20px;">هیچ نوبتی ثبت نشده است.</p>';
            return;
        }
        div.innerHTML = data.appointments.map(a => `
            <div class="admin-box ${a.status}">
                <strong>${a.service_name}</strong><br>
                👤 ${a.user_name} | 📞 ${a.phone} | 🆔 ${a.telegram_id}<br>
                📅 ${a.appointment_date} | 🕐 ${a.appointment_time}<br>
                وضعیت: <span class="status-badge ${a.status}">${a.status === 'pending' ? 'در انتظار' : a.status === 'confirmed' ? 'تأیید شده' : a.status === 'cancelled' ? 'لغو شده' : 'انجام شده'}</span>
                ${a.receipt ? `<br><img src="${a.receipt}" class="receipt-thumb" onclick="window.open('${a.receipt}')" />` : '<br>بدون رسید'}
                <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
                    <select onchange="updateStatus(${a.id}, this.value)">
                        <option value="pending" ${a.status === 'pending' ? 'selected' : ''}>در انتظار</option>
                        <option value="confirmed" ${a.status === 'confirmed' ? 'selected' : ''}>تأیید شده</option>
                        <option value="completed" ${a.status === 'completed' ? 'selected' : ''}>انجام شده</option>
                        <option value="cancelled" ${a.status === 'cancelled' ? 'selected' : ''}>لغو شده</option>
                    </select>
                    ${a.status === 'pending' ? `<button class="btn-sm btn-sm-success" onclick="quickApprove(${a.id})">✔️ تأیید</button>` : ''}
                </div>
            </div>
        `).join('');
    }

    async function updateStatus(id, status) {
        const res = await fetch(`/api/admin/appointments/${id}/status`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({status})
        });
        const result = await res.json();
        alert(result.message);
        loadAppointments();
        loadStats();
    }

    async function quickApprove(id) {
        if (!confirm('آیا از تأیید این نوبت مطمئن هستید؟')) return;
        await updateStatus(id, 'confirmed');
    }

    // ====== کاربران ======
    async function loadUsers() {
        const res = await fetch('/api/admin/users');
        const data = await res.json();
        const div = document.getElementById('usersList');
        if (!data.users || data.users.length === 0) {
            div.innerHTML = '<p style="color:var(--luxe-text-muted);text-align:center;padding:20px;">هیچ کاربری ثبت نشده است.</p>';
            return;
        }
        div.innerHTML = data.users.map(u => `
            <div class="user-item">
                <div>
                    <strong>${u.name}</strong> | 📞 ${u.phone || '---'} | 🆔 ${u.telegram_id}
                    ${u.is_admin === 1 ? '<span class="admin-badge">👑 ادمین</span>' : ''}
                </div>
                <div style="font-size:12px;color:var(--luxe-text-muted);">
                    ${u.created_at ? new Date(u.created_at).toLocaleDateString('fa-IR') : ''}
                </div>
            </div>
        `).join('');
    }

    // ====== ساعات کاری ======
    async function loadSchedule() {
        const res = await fetch('/api/admin/schedule');
        const data = await res.json();
        const div = document.getElementById('scheduleList');
        const days = ['شنبه', 'یکشنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنجشنبه', 'جمعه'];
        div.innerHTML = data.schedule.map(s => `
            <div class="schedule-item">
                <span class="day-name">${days[s.day_of_week]}</span>
                <input type="time" value="${s.start_time}" data-day="${s.day_of_week}" class="start-time">
                <span>تا</span>
                <input type="time" value="${s.end_time}" data-day="${s.day_of_week}" class="end-time">
                <label>
                    <input type="checkbox" ${s.is_active === 1 ? 'checked' : ''} data-day="${s.day_of_week}" class="active-check">
                    فعال
                </label>
            </div>
        `).join('');
    }

    document.getElementById('saveSchedule').addEventListener('click', async function() {
        const items = document.querySelectorAll('.schedule-item');
        const updates = [];
        items.forEach(item => {
            const day = parseInt(item.querySelector('.start-time').dataset.day);
            const start = item.querySelector('.start-time').value;
            const end = item.querySelector('.end-time').value;
            const active = item.querySelector('.active-check').checked ? 1 : 0;
            updates.push({ day_of_week: day, start_time: start, end_time: end, is_active: active });
        });
        for (const update of updates) {
            await fetch('/api/admin/schedule', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(update)
            });
        }
        alert('✅ ساعات کاری با موفقیت ذخیره شد!');
        loadSchedule();
    });

    // ====== اعلان همگانی ======
    document.getElementById('sendBroadcast').addEventListener('click', async function() {
        const message = document.getElementById('broadcastMessage').value.trim();
        if (!message) {
            alert('لطفاً متن پیام را وارد کنید.');
            return;
        }
        if (!confirm(`آیا از ارسال این پیام به همه کاربران مطمئن هستید؟\n\n${message}`)) return;
        const res = await fetch('/api/admin/broadcast', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({message})
        });
        const result = await res.json();
        document.getElementById('broadcastResult').innerHTML = `<div class="msg msg-success">✅ ${result.message}</div>`;
        document.getElementById('broadcastMessage').value = '';
    });

    // ====== بارگیری اولیه ======
    loadStats();
    loadAppointments();
</script>
</body>
</html>
