<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>M4Cut - پنل مدیریت</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ====== استایل اختصاصی منوها و پنل ادمین ====== */
        .admin-tabs {
            display: flex;
            gap: 8px;
            margin: 1rem 0 1.5rem;
            background: rgba(10, 14, 23, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 8px;
            border: 1px solid var(--luxe-border);
            flex-wrap: wrap;
        }
        .admin-tabs button {
            flex: 1 1 auto;
            min-width: 60px;
            padding: 0.7rem 0.5rem;
            border: none;
            border-radius: 12px;
            background: transparent;
            color: var(--luxe-text-muted);
            font-size: clamp(0.7rem, 1.8vw, 0.85rem);
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            text-align: center;
            min-height: 44px;
            touch-action: manipulation;
            position: relative;
            border: 1px solid transparent;
        }
        .admin-tabs button:hover {
            background: rgba(212, 184, 124, 0.05);
            color: var(--luxe-text);
            border-color: var(--luxe-border-light);
        }
        .admin-tabs button.active {
            background: var(--luxe-gold);
            color: #0A0E17;
            box-shadow: 0 4px 20px rgba(212, 184, 124, 0.25);
            border-color: var(--luxe-gold);
            transform: translateY(-2px);
        }
        .admin-tabs button:active {
            transform: scale(0.96);
        }
        .admin-tabs button .badge-tab {
            display: inline-block;
            background: var(--luxe-danger);
            color: white;
            font-size: 10px;
            font-weight: 700;
            padding: 1px 8px;
            border-radius: 20px;
            margin-right: 4px;
            vertical-align: top;
        }

        /* سایر استایل‌های قبلی */
        .admin-box {
            background: var(--luxe-bg);
            padding: 0.9rem 1rem;
            border-radius: var(--radius);
            margin: 0.5rem 0;
            border-right: 4px solid var(--luxe-gold);
            transition: all 0.3s ease;
            word-wrap: break-word;
        }
        .admin-box:hover {
            border-color: var(--luxe-gold-light);
        }
        .admin-box.confirmed { border-right-color: var(--luxe-success); }
        .admin-box.cancelled { border-right-color: var(--luxe-danger); opacity: 0.6; }
        .admin-box.completed { border-right-color: var(--luxe-text-muted); }
        .admin-box .receipt-thumb {
            max-width: 60px;
            max-height: 60px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            border: 1px solid var(--luxe-border);
            transition: all 0.3s ease;
        }
        .admin-box .receipt-thumb:hover {
            transform: scale(1.05);
            border-color: var(--luxe-gold);
        }
        .status-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: clamp(0.6rem, 1.4vw, 0.7rem);
            font-weight: 700;
        }
        .status-badge.pending { background: rgba(212, 184, 124, 0.2); color: var(--luxe-gold); }
        .status-badge.confirmed { background: rgba(46, 139, 87, 0.2); color: var(--luxe-success); }
        .status-badge.cancelled { background: rgba(178, 34, 52, 0.2); color: var(--luxe-danger); }
        .status-badge.completed { background: rgba(154, 165, 181, 0.2); color: var(--luxe-text-muted); }

        .search-box {
            display: flex;
            gap: 6px;
            margin-bottom: 0.75rem;
            flex-wrap: wrap;
        }
        .search-box input, .search-box select {
            flex: 1 1 auto;
            min-width: 70px;
            padding: 0.5rem 0.6rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--luxe-border);
            background: var(--luxe-bg);
            color: var(--luxe-text);
            font-family: inherit;
            font-size: clamp(0.7rem, 1.8vw, 0.85rem);
            min-height: 36px;
        }
        .search-box input:focus, .search-box select:focus {
            border-color: var(--luxe-gold);
            outline: none;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.6rem 0;
            border-bottom: 1px solid var(--luxe-border);
            flex-wrap: wrap;
            gap: 6px;
        }
        .setting-item .label { color: var(--luxe-text-muted); font-size: clamp(0.75rem, 2vw, 0.9rem); }
        .setting-item input {
            background: var(--luxe-bg);
            border: 1px solid var(--luxe-border);
            border-radius: var(--radius-sm);
            padding: 0.4rem 0.6rem;
            color: var(--luxe-text);
            font-family: inherit;
            width: 180px;
            min-height: 34px;
            font-size: clamp(0.75rem, 2vw, 0.9rem);
        }
        .setting-item input:focus { border-color: var(--luxe-gold); outline: none; }

        .broadcast-area {
            background: var(--luxe-bg);
            padding: 1rem;
            border-radius: var(--radius);
            border: 1px solid var(--luxe-border);
        }
        .broadcast-area textarea {
            min-height: 60px;
            resize: vertical;
            width: 100%;
            padding: 0.7rem 0.9rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--luxe-border);
            background: var(--luxe-bg);
            color: var(--luxe-text);
            font-family: inherit;
            font-size: clamp(0.75rem, 2vw, 0.9rem);
        }
        .broadcast-area textarea:focus { border-color: var(--luxe-gold); outline: none; }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--luxe-card);
            color: var(--luxe-text);
            padding: 0.8rem 1.5rem;
            border-radius: var(--radius);
            border: 1px solid var(--luxe-gold);
            box-shadow: var(--luxe-shadow);
            z-index: 9999;
            font-size: clamp(0.85rem, 2vw, 1rem);
            animation: slideUp 0.4s ease;
            max-width: 90%;
            text-align: center;
        }
        .toast.success { border-color: var(--luxe-success); }
        .toast.error { border-color: var(--luxe-danger); }
        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }

        .error-box {
            background: rgba(178, 34, 52, 0.1);
            border: 1px solid var(--luxe-danger);
            color: var(--luxe-danger);
            padding: 1rem;
            border-radius: var(--radius);
            margin: 0.5rem 0;
            text-align: center;
        }

        @media (max-width: 400px) {
            .admin-tabs button { min-width: 45px; padding: 0.4rem 0.2rem; font-size: 0.65rem; }
            .search-box input, .search-box select { min-width: 50px; font-size: 0.65rem; padding: 0.3rem 0.4rem; }
            .setting-item input { width: 120px; }
        }
        @media (max-width: 350px) {
            .admin-tabs { gap: 4px; padding: 4px; }
            .admin-tabs button { min-width: 40px; font-size: 0.55rem; padding: 0.3rem 0.1rem; }
            .search-box { flex-direction: column; }
            .search-box input, .search-box select { width: 100%; min-width: unset; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand-header">
            <div class="brand-logo">M4<span>Cut</span></div>
            <div class="brand-tagline">📊 پنل مدیریت</div>
        </div>

        <!-- ====== منوهای تفکیک‌شده ====== -->
        <div class="admin-tabs" id="adminTabs">
            <button class="active" data-tab="stats">📊 آمار</button>
            <button data-tab="apps">📋 نوبت‌ها</button>
            <button data-tab="users">👥 کاربران</button>
            <button data-tab="schedule">⏰ ساعات</button>
            <button data-tab="settings">⚙️ تنظیمات</button>
            <button data-tab="broadcast">📢 اعلان</button>
        </div>

        <!-- ====== تب‌ها ====== -->
        <div id="tab-stats" class="tab-content active">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;">
                <span style="font-weight:600;">📊 آمار کلی</span>
                <button class="btn-sm btn-sm-primary" onclick="loadStats()">⟳ بروزرسانی</button>
            </div>
            <div class="stats-grid">
                <div class="stat-card gold"><span class="number" id="statUsers">...</span><span class="label">👥 کاربران</span></div>
                <div class="stat-card gold"><span class="number" id="statTotalApps">...</span><span class="label">📋 کل نوبت‌ها</span></div>
                <div class="stat-card"><span class="number" id="statTodayApps">...</span><span class="label">📅 نوبت‌های امروز</span></div>
                <div class="stat-card"><span class="number" id="statUpcomingApps">...</span><span class="label">📆 نوبت‌های آینده</span></div>
            </div>
            <div class="stats-detail">
                <div class="row"><span class="label">⏳ در انتظار</span><span class="value" id="statPending">...</span></div>
                <div class="row"><span class="label">✅ تأیید شده</span><span class="value" id="statConfirmed">...</span></div>
                <div class="row"><span class="label">✔️ انجام شده</span><span class="value" id="statCompleted">...</span></div>
                <div class="row"><span class="label">❌ لغو شده</span><span class="value" id="statCancelled">...</span></div>
            </div>
        </div>

        <div id="tab-apps" class="tab-content">
            <div class="search-box">
                <select id="filterStatus"><option value="">همه</option><option value="pending">در انتظار</option><option value="confirmed">تأیید</option><option value="completed">انجام</option><option value="cancelled">لغو</option></select>
                <input type="text" id="filterUser" placeholder="آیدی کاربر...">
                <input type="text" id="filterDate" placeholder="تاریخ (مثلاً 1404/05/20)...">
                <button class="btn-sm btn-sm-primary" onclick="applyFilters()">🔍 فیلتر</button>
                <button class="btn-sm btn-sm-primary" onclick="exportExcel()">📤 اکسل</button>
            </div>
            <div id="appointmentsList"><div style="text-align:center;padding:2rem;color:var(--luxe-text-muted);">⏳ در حال بارگیری...</div></div>
        </div>

        <div id="tab-users" class="tab-content">
            <div id="usersList"><div style="text-align:center;padding:2rem;color:var(--luxe-text-muted);">⏳ در حال بارگیری...</div></div>
        </div>

        <div id="tab-schedule" class="tab-content">
            <div id="scheduleList"><div style="text-align:center;padding:2rem;color:var(--luxe-text-muted);">⏳ در حال بارگیری...</div></div>
            <button id="saveSchedule" class="btn btn-success" style="margin-top:0.75rem;">💾 ذخیره</button>
        </div>

        <div id="tab-settings" class="tab-content">
            <div class="setting-item">
                <span class="label">📞 شماره پشتیبانی</span>
                <div style="display:flex;gap:4px;flex-wrap:wrap;">
                    <input type="text" id="supportInput" value="@Tvpnred">
                    <button class="btn-sm btn-sm-primary" onclick="updateSupport()">ذخیره</button>
                </div>
            </div>
        </div>

        <div id="tab-broadcast" class="tab-content">
            <div class="broadcast-area">
                <textarea id="broadcastMessage" placeholder="متن پیام همگانی..."></textarea>
                <button id="sendBroadcast" class="btn btn-success">📤 ارسال</button>
                <div id="broadcastResult"></div>
            </div>
        </div>

        <button onclick="Telegram.WebApp.close()" class="btn btn-close">❌ بستن</button>
    </div>

    <script>
        // ============================================================
        //   M4Cut - پنل ادمین (دیباگ قوی و تفکیک منوها)
        // ============================================================

        // ----- اعتبارسنجی کاربر -----
        const userStr = localStorage.getItem('user');
        if (!userStr) {
            alert('⛔ لطفاً ابتدا وارد شوید.');
            window.location.href = '/static/index.html';
        }
        const user = JSON.parse(userStr);
        if (!user || user.is_admin !== 1) {
            alert('⛔ شما دسترسی ادمین ندارید.');
            window.location.href = '/static/index.html';
        }

        // ----- متغیرها -----
        let toastTimeout = null;
        let currentPage = 1;
        let totalPages = 1;
        const PER_PAGE = 10;

        // ----- نمایش پیام (Toast) -----
        function showToast(message, type = 'success') {
            const old = document.querySelector('.toast');
            if (old) old.remove();
            if (toastTimeout) clearTimeout(toastTimeout);

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);

            toastTimeout = setTimeout(() => {
                toast.remove();
                toastTimeout = null;
            }, 4000);
        }

        // ----- تابع تغییر تب (تفکیک شده با دیباگ) -----
        function switchTab(tabId) {
            try {
                // 1. مخفی کردن همه تب‌ها
                document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
                // 2. غیرفعال کردن همه دکمه‌ها
                document.querySelectorAll('.admin-tabs button').forEach(el => el.classList.remove('active'));

                // 3. نمایش تب جدید
                const targetTab = document.getElementById('tab-' + tabId);
                if (targetTab) {
                    targetTab.classList.add('active');
                } else {
                    console.error(`Tab with id tab-${tabId} not found!`);
                    showToast('خطا در تغییر تب!', 'error');
                    return;
                }

                // 4. فعال کردن دکمه مربوطه
                const targetBtn = document.querySelector(`.admin-tabs button[data-tab="${tabId}"]`);
                if (targetBtn) {
                    targetBtn.classList.add('active');
                }

                // 5. بارگیری داده‌ها (با مدیریت خطا)
                console.log(`🔄 Switching to tab: ${tabId}`);
                if (tabId === 'stats') loadStats();
                else if (tabId === 'apps') loadAppointments();
                else if (tabId === 'users') loadUsers();
                else if (tabId === 'schedule') loadSchedule();
            } catch (error) {
                console.error('🔥 SwitchTab Error:', error);
                showToast('خطا در تغییر منو: ' + error.message, 'error');
            }
        }

        // ----- رویدادهای منوها (با دیباگ) -----
        document.querySelectorAll('.admin-tabs button').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                const tabId = this.dataset.tab;
                if (!tabId) {
                    console.error('No data-tab attribute!');
                    return;
                }
                // اگر همان تب فعال است، کاری نکن
                if (this.classList.contains('active')) return;
                switchTab(tabId);
            });
        });

        // ============================================================
        //   توابع بارگیری داده‌ها (همگی با دیباگ قوی)
        // ============================================================

        // ----- ۱. آمار -----
        async function loadStats() {
            const statElements = ['statUsers', 'statTotalApps', 'statTodayApps', 'statUpcomingApps', 'statPending', 'statConfirmed', 'statCompleted', 'statCancelled'];
            statElements.forEach(id => {
                const el = document.getElementById(id);
                if (el) el.textContent = '...';
            });

            try {
                const res = await fetch('/api/admin/stats');
                if (!res.ok) throw new Error(`HTTP Error ${res.status}`);
                const data = await res.json();

                if (data.status === 'ok') {
                    const s = data.stats;
                    document.getElementById('statUsers').textContent = s.total_users || 0;
                    document.getElementById('statTotalApps').textContent = s.total_appointments || 0;
                    document.getElementById('statTodayApps').textContent = s.today_appointments || 0;
                    document.getElementById('statUpcomingApps').textContent = s.upcoming_appointments || 0;
                    document.getElementById('statPending').textContent = s.status?.pending || 0;
                    document.getElementById('statConfirmed').textContent = s.status?.confirmed || 0;
                    document.getElementById('statCompleted').textContent = s.status?.completed || 0;
                    document.getElementById('statCancelled').textContent = s.status?.cancelled || 0;
                } else {
                    throw new Error(data.message || 'خطا در دریافت آمار');
                }
            } catch (error) {
                console.error('❌ loadStats Error:', error);
                showToast('خطا در بارگیری آمار: ' + error.message, 'error');
            }
        }

        // ----- ۲. نوبت‌ها (با Pagination و دیباگ) -----
        let allAppointments = [];

        async function loadAppointments(page = 1) {
            const div = document.getElementById('appointmentsList');
            if (!div) return;
            div.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--luxe-text-muted);">⏳ در حال بارگیری...</div>';

            try {
                const status = document.getElementById('filterStatus')?.value || '';
                const user = document.getElementById('filterUser')?.value.trim() || '';
                const date = document.getElementById('filterDate')?.value.trim() || '';

                let url = `/api/admin/appointments?page=${page}&limit=${PER_PAGE}`;
                if (status) url += `&status=${status}`;
                if (user) url += `&user=${user}`;
                if (date) url += `&date=${date}`;

                const res = await fetch(url);
                if (!res.ok) throw new Error(`HTTP Error ${res.status}`);
                const data = await res.json();

                if (data.status === 'ok') {
                    allAppointments = data.appointments || [];
                    const pagination = data.pagination || {};
                    currentPage = pagination.page || 1;
                    totalPages = pagination.pages || 1;

                    renderAppointments(allAppointments, pagination);
                } else {
                    throw new Error(data.message || 'خطا در دریافت نوبت‌ها');
                }
            } catch (error) {
                console.error('❌ loadAppointments Error:', error);
                div.innerHTML = `<div class="error-box">❌ ${error.message}</div>`;
                showToast('خطا در بارگیری نوبت‌ها', 'error');
            }
        }

        function renderAppointments(apps, pagination) {
            const div = document.getElementById('appointmentsList');
            if (!div) return;

            if (!apps || apps.length === 0) {
                div.innerHTML = '<p style="color:var(--luxe-text-muted);text-align:center;padding:1rem;">هیچ نوبتی یافت نشد.</p>';
                return;
            }

            const statusMap = {
                'pending': '<span class="status-badge pending">در انتظار</span>',
                'confirmed': '<span class="status-badge confirmed">✅ تأیید</span>',
                'cancelled': '<span class="status-badge cancelled">لغو</span>',
                'completed': '<span class="status-badge completed">انجام</span>'
            };

            let html = apps.map(a => `
                    <div class="admin-box ${a.status}">
                        <strong>${a.service_name || 'بدون خدمت'}</strong><br>
                        👤 ${a.user_name || 'نامشخص'} | 📞 ${a.phone || '---'} | 🆔 ${a.telegram_id || '---'}<br>
                        📅 ${a.appointment_date || '---'} | 🕐 ${a.appointment_time || '---'}<br>
                        وضعیت: ${statusMap[a.status] || a.status}
                        ${a.receipt ? `<br><img src="${a.receipt}" class="receipt-thumb" onclick="window.open('${a.receipt}')" />` : ''}
                        <div style="margin-top:8px;display:flex;gap:4px;flex-wrap:wrap;align-items:center;">
                            <select onchange="updateStatus(${a.id}, this.value)" style="padding:0.3rem 0.5rem;border-radius:var(--radius-sm);border:1px solid var(--luxe-border);background:var(--luxe-bg);color:var(--luxe-text);font-family:inherit;font-size:clamp(0.65rem,1.6vw,0.75rem);min-height:30px;">
                                <option value="pending" ${a.status === 'pending' ? 'selected' : ''}>در انتظار</option>
                                <option value="confirmed" ${a.status === 'confirmed' ? 'selected' : ''}>تأیید</option>
                                <option value="completed" ${a.status === 'completed' ? 'selected' : ''}>انجام</option>
                                <option value="cancelled" ${a.status === 'cancelled' ? 'selected' : ''}>لغو</option>
                            </select>
                            ${a.status === 'pending' ? `<button class="btn-sm btn-sm-success" onclick="quickApprove(${a.id})">✔️ تأیید</button>` : ''}
                        </div>
                    </div>
                `).join('');

            // Pagination
            if (pagination && pagination.pages > 1) {
                html += `
                        <div style="display:flex;justify-content:center;gap:8px;margin-top:1rem;flex-wrap:wrap;">
                            ${pagination.page > 1 ? `<button class="btn-sm btn-sm-primary" onclick="changePage(${pagination.page - 1})">⬅️ قبلی</button>` : ''}
                            <span style="color:var(--luxe-text-muted);font-size:0.85rem;">صفحه ${pagination.page} از ${pagination.pages}</span>
                            ${pagination.page < pagination.pages ? `<button class="btn-sm btn-sm-primary" onclick="changePage(${pagination.page + 1})">بعدی ➡️</button>` : ''}
                        </div>
                    `;
            }
            div.innerHTML = html;
        }

        function changePage(page) {
            loadAppointments(page);
            document.getElementById('appointmentsList')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function applyFilters() {
            loadAppointments(1);
        }

        async function updateStatus(id, status) {
            try {
                const res = await fetch(`/api/admin/appointments/${id}/status`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status })
                });
                if (!res.ok) throw new Error(`HTTP Error ${res.status}`);
                const result = await res.json();
                if (result.status === 'ok') {
                    showToast(result.message || 'وضعیت با موفقیت تغییر کرد.', 'success');
                    loadAppointments(currentPage);
                    loadStats();
                } else {
                    throw new Error(result.message || 'خطا در تغییر وضعیت');
                }
            } catch (error) {
                console.error('❌ updateStatus Error:', error);
                showToast('خطا: ' + error.message, 'error');
            }
        }

        async function quickApprove(id) {
            if (!confirm('آیا از تأیید این نوبت مطمئن هستید؟')) return;
            await updateStatus(id, 'confirmed');
        }

        function exportExcel() {
            try {
                window.open('/api/admin/export/excel', '_blank');
                showToast('📤 در حال دانلود فایل اکسل...', 'success');
            } catch (e) {
                showToast('خطا در دانلود اکسل', 'error');
            }
        }

        // ----- ۳. کاربران -----
        async function loadUsers() {
            const div = document.getElementById('usersList');
            if (!div) return;
            div.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--luxe-text-muted);">⏳ در حال بارگیری...</div>';

            try {
                const res = await fetch('/api/admin/users');
                if (!res.ok) throw new Error(`HTTP Error ${res.status}`);
                const data = await res.json();

                if (data.status === 'ok' && data.users) {
                    if (data.users.length === 0) {
                        div.innerHTML = '<p style="color:var(--luxe-text-muted);text-align:center;padding:1rem;">هیچ کاربری ثبت نشده است.</p>';
                        return;
                    }
                    div.innerHTML = data.users.map(u => `
                            <div class="user-item">
                                <div>
                                    <strong>${u.name || 'نامشخص'}</strong> | 📞 ${u.phone || '---'} | 🆔 ${u.telegram_id || '---'}
                                    ${u.is_admin === 1 ? '<span class="admin-badge">👑 ادمین</span>' : ''}
                                </div>
                                <div style="display:flex;gap:4px;flex-wrap:wrap;">
                                    <button class="btn-sm btn-sm-primary" onclick="toggleAdmin(${u.telegram_id}, ${u.is_admin === 1 ? 0 : 1})">${u.is_admin === 1 ? '⬇️ حذف ادمین' : '⬆️ ادمین کن'}</button>
                                    <button class="btn-sm btn-sm-danger" onclick="deleteUser(${u.telegram_id})">🗑️ حذف</button>
                                </div>
                            </div>
                        `).join('');
                } else {
                    throw new Error(data.message || 'خطا در دریافت کاربران');
                }
            } catch (error) {
                console.error('❌ loadUsers Error:', error);
                div.innerHTML = `<div class="error-box">❌ ${error.message}</div>`;
                showToast('خطا در بارگیری کاربران', 'error');
            }
        }

        async function toggleAdmin(id, newStatus) {
            if (!confirm(`آیا از ${newStatus === 1 ? 'ادمین کردن' : 'حذف ادمین از'} این کاربر مطمئن هستید؟`)) return;
            try {
                const res = await fetch(`/api/admin/users/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ is_admin: newStatus })
                });
                if (!res.ok) throw new Error(`HTTP Error ${res.status}`);
                const result = await res.json();
                if (result.status === 'ok') {
                    showToast(result.message || 'نقش کاربر تغییر کرد.', 'success');
                    loadUsers();
                } else {
                    throw new Error(result.message || 'خطا در تغییر نقش');
                }
            } catch (error) {
                console.error('❌ toggleAdmin Error:', error);
                showToast('خطا: ' + error.message, 'error');
            }
        }

        async function deleteUser(id) {
            if (!confirm('آیا از حذف این کاربر مطمئن هستید؟ این عملیات قابل بازگشت نیست!')) return;
            try {
                const res = await fetch(`/api/admin/users/${id}`, { method: 'DELETE' });
                if (!res.ok) throw new Error(`HTTP Error ${res.status}`);
                const result = await res.json();
                if (result.status === 'ok') {
                    showToast(result.message || 'کاربر با موفقیت حذف شد.', 'success');
                    loadUsers();
                    loadStats();
                } else {
                    throw new Error(result.message || 'خطا در حذف کاربر');
                }
            } catch (error) {
                console.error('❌ deleteUser Error:', error);
                showToast('خطا: ' + error.message, 'error');
            }
        }

        // ----- ۴. ساعات کاری -----
        async function loadSchedule() {
            const div = document.getElementById('scheduleList');
            if (!div) return;
            div.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--luxe-text-muted);">⏳ در حال بارگیری...</div>';

            try {
                const res = await fetch('/api/admin/schedule');
                if (!res.ok) throw new Error(`HTTP Error ${res.status}`);
                const data = await res.json();

                if (data.status === 'ok' && data.schedule) {
                    const days = ['شنبه', 'یکشنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنجشنبه', 'جمعه'];
                    div.innerHTML = data.schedule.map(s => `
                            <div class="schedule-item">
                                <span class="day-name">${days[s.day_of_week]}</span>
                                <input type="time" value="${s.start_time}" data-day="${s.day_of_week}" class="start-time">
                                <span>تا</span>
                                <input type="time" value="${s.end_time}" data-day="${s.day_of_week}" class="end-time">
                                <span>ظرفیت: <input type="number" value="${s.capacity}" data-day="${s.day_of_week}" class="capacity-input" min="0" max="10"></span>
                                <label><input type="checkbox" ${s.is_active === 1 ? 'checked' : ''} data-day="${s.day_of_week}" class="active-check"> فعال</label>
                            </div>
                        `).join('');
                } else {
                    throw new Error(data.message || 'خطا در دریافت ساعات کاری');
                }
            } catch (error) {
                console.error('❌ loadSchedule Error:', error);
                div.innerHTML = `<div class="error-box">❌ ${error.message}</div>`;
                showToast('خطا در بارگیری ساعات کاری', 'error');
            }
        }

        document.getElementById('saveSchedule')?.addEventListener('click', async function() {
            const items = document.querySelectorAll('.schedule-item');
            const updates = [];
            let hasError = false;

            items.forEach(item => {
                const day = parseInt(item.querySelector('.start-time').dataset.day);
                const start = item.querySelector('.start-time').value;
                const end = item.querySelector('.end-time').value;
                const cap = parseInt(item.querySelector('.capacity-input').value) || 2;

                if (!start || !end) {
                    hasError = true;
                    showToast(`لطفاً ساعت شروع و پایان را برای ${item.querySelector('.day-name').textContent} وارد کنید.`, 'error');
                    return;
                }
                updates.push({
                    day_of_week: day,
                    start_time: start,
                    end_time: end,
                    capacity: cap,
                    is_active: item.querySelector('.active-check').checked ? 1 : 0
                });
            });

            if (hasError) return;

            try {
                this.disabled = true;
                this.textContent = '⏳ در حال ذخیره...';

                for (const update of updates) {
                    const res = await fetch('/api/admin/schedule', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(update)
                    });
                    if (!res.ok) throw new Error('خطا در ذخیره');
                }
                showToast('✅ ساعات کاری با موفقیت ذخیره شد!', 'success');
                loadSchedule();
            } catch (error) {
                console.error('❌ saveSchedule Error:', error);
                showToast('❌ خطا در ذخیره ساعات کاری.', 'error');
            } finally {
                this.disabled = false;
                this.textContent = '💾 ذخیره';
            }
        });

        // ----- ۵. تنظیمات پشتیبانی -----
        async function loadSupport() {
            try {
                const res = await fetch('/api/admin/support');
                if (!res.ok) throw new Error(`HTTP Error ${res.status}`);
                const data = await res.json();
                if (data.status === 'ok') {
                    document.getElementById('supportInput').value = data.support_contact || '@Tvpnred';
                }
            } catch (error) {
                console.error('❌ loadSupport Error:', error);
            }
        }

        async function updateSupport() {
            const val = document.getElementById('supportInput').value.trim();
            if (!val) {
                showToast('لطفاً مقدار را وارد کنید.', 'error');
                return;
            }
            try {
                const btn = event?.target;
                if (btn) btn.disabled = true;

                const res = await fetch('/api/admin/support', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ support_contact: val })
                });
                if (!res.ok) throw new Error(`HTTP Error ${res.status}`);
                const result = await res.json();
                if (result.status === 'ok') {
                    showToast('✅ شماره پشتیبانی به‌روزرسانی شد!', 'success');
                } else {
                    throw new Error(result.message || 'خطا در به‌روزرسانی');
                }
            } catch (error) {
                console.error('❌ updateSupport Error:', error);
                showToast('خطا: ' + error.message, 'error');
            } finally {
                if (btn) btn.disabled = false;
            }
        }

        // ----- ۶. اعلان همگانی -----
        document.getElementById('sendBroadcast')?.addEventListener('click', async function() {
            const msg = document.getElementById('broadcastMessage').value.trim();
            if (!msg) {
                showToast('لطفاً متن پیام را وارد کنید.', 'error');
                return;
            }
            if (!confirm(`آیا از ارسال این پیام به همه کاربران مطمئن هستید؟\n\n${msg}`)) return;

            try {
                this.disabled = true;
                this.textContent = '⏳ در حال ارسال...';

                const res = await fetch('/api/admin/broadcast', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg })
                });
                if (!res.ok) throw new Error(`HTTP Error ${res.status}`);
                const result = await res.json();

                if (result.status === 'ok') {
                    document.getElementById('broadcastResult').innerHTML = `<div class="msg msg-success">✅ ${result.message}</div>`;
                    document.getElementById('broadcastMessage').value = '';
                    showToast(`✅ ${result.message}`, 'success');
                } else {
                    throw new Error(result.message || 'خطا در ارسال پیام');
                }
            } catch (error) {
                console.error('❌ sendBroadcast Error:', error);
                showToast('خطا: ' + error.message, 'error');
            } finally {
                this.disabled = false;
                this.textContent = '📤 ارسال';
            }
        });

        // ============================================================
        //   بارگیری اولیه
        // ============================================================
        console.log('🚀 Admin Panel Started.');
        // بارگیری پیش‌فرض تب آمار
        loadStats();

        // به‌روزرسانی خودکار آمار هر ۶۰ ثانیه
        setInterval(() => {
            const statsTab = document.getElementById('tab-stats');
            if (statsTab && statsTab.classList.contains('active')) {
                loadStats();
            }
        }, 60000);
    </script>
</body>
</html>
