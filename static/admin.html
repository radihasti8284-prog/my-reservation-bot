<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M4Cut - پنل مدیریت</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-box {
            background: var(--m4cut-smoke);
            padding: 16px;
            border-radius: 14px;
            margin: 10px 0;
            border-right: 4px solid var(--m4cut-brass);
        }
        .admin-box.confirmed { border-color: var(--m4cut-pine); }
        .admin-box.cancelled { border-color: var(--m4cut-clay); }
        .admin-box.completed { border-color: var(--m4cut-ink); }
        .receipt-thumb {
            max-width: 70px;
            max-height: 70px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid var(--m4cut-border);
        }
        .broadcast-area {
            background: var(--m4cut-smoke);
            padding: 16px;
            border-radius: 14px;
            margin: 10px 0;
        }
        .broadcast-area textarea {
            min-height: 80px;
            resize: vertical;
        }
        .schedule-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--m4cut-border);
            flex-wrap: wrap;
        }
        .schedule-item .day-name { width: 70px; font-weight: 600; }
        .schedule-item input[type="time"] { width: 100px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--m4cut-border); margin:0; }
        .schedule-item label { display:flex; align-items:center; gap:4px; font-size:13px; margin:0; }
        .btn-sm { padding: 6px 14px; border: none; border-radius: 8px; cursor: pointer; font-family: inherit; font-weight: 600; font-size: 13px; }
        .btn-sm-success { background: var(--m4cut-pine); color: white; }
        .btn-sm-success:hover { background: #0f2d26; }
    </style>
</head>
<body>
<div class="container">
    <div class="brand-header">
        <div class="brand-logo">M4<span>Cut</span></div>
        <div class="brand-tagline">📊 پنل مدیریت</div>
    </div>

    <div class="tabs">
        <button class="active" data-tab="apps">📋 نوبت‌ها</button>
        <button data-tab="users">👥 کاربران</button>
        <button data-tab="schedule">⏰ ساعات کاری</button>
        <button data-tab="broadcast">📢 اعلان</button>
    </div>

    <!-- نوبت‌ها -->
    <div id="tab-apps" class="tab-content active">
        <div id="appointmentsList"></div>
    </div>

    <!-- کاربران -->
    <div id="tab-users" class="tab-content">
        <div id="usersList"></div>
    </div>

    <!-- ساعات کاری -->
    <div id="tab-schedule" class="tab-content">
        <div id="scheduleList"></div>
        <button id="saveSchedule" class="btn btn-success" style="margin-top:12px;">💾 ذخیره تنظیمات</button>
    </div>

    <!-- اعلان همگانی -->
    <div id="tab-broadcast" class="tab-content">
        <div class="broadcast-area">
            <label>متن پیام همگانی:</label>
            <textarea id="broadcastMessage" placeholder="متن پیام را وارد کنید..."></textarea>
            <button id="sendBroadcast" class="btn btn-success">📤 ارسال به همه کاربران</button>
            <div id="broadcastResult"></div>
        </div>
    </div>

    <button onclick="Telegram.WebApp.close()" class="btn btn-close">❌ بستن</button>
</div>

<script>
    const user = JSON.parse(localStorage.getItem('user'));
    if (!user || user.is_admin !== 1) window.location.href = '/static/index.html';

    // ====== تب‌ها ======
    document.querySelectorAll('.tabs button').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + this.dataset.tab).classList.add('active');
            if (this.dataset.tab === 'apps') loadAppointments();
            if (this.dataset.tab === 'users') loadUsers();
            if (this.dataset.tab === 'schedule') loadSchedule();
        });
    });

    // ====== نوبت‌ها ======
    async function loadAppointments() {
        const res = await fetch('/api/admin/appointments');
        const data = await res.json();
        const div = document.getElementById('appointmentsList');
        if (!data.appointments || data.appointments.length === 0) {
            div.innerHTML = '<p style="color:var(--m4cut-gray);text-align:center;padding:20px;">هیچ نوبتی ثبت نشده است.</p>';
            return;
        }
        div.innerHTML = data.appointments.map(a => `
            <div class="admin-box ${a.status}">
                <strong>${a.service_name}</strong><br>
                👤 ${a.user_name} | 📞 ${a.phone} | 🆔 ${a.telegram_id}<br>
                📅 ${a.appointment_date} | 🕐 ${a.appointment_time}<br>
                وضعیت: ${a.status}
                ${a.receipt ? `<br><img src="${a.receipt}" class="receipt-thumb" onclick="window.open('${a.receipt}')" />` : '<br>بدون رسید'}
                <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;">
                    <select onchange="updateStatus(${a.id}, this.value)" style="padding:6px 10px;border-radius:8px;border:1px solid var(--m4cut-border);font-family:inherit;">
                        <option value="pending" ${a.status === 'pending' ? 'selected' : ''}>در انتظار</option>
                        <option value="confirmed" ${a.status === 'confirmed' ? 'selected' : ''}>تأیید شده</option>
                        <option value="completed" ${a.status === 'completed' ? 'selected' : ''}>انجام شده</option>
                        <option value="cancelled" ${a.status === 'cancelled' ? 'selected' : ''}>لغو شده</option>
                    </select>
                    ${a.status === 'pending' ? `<button class="btn-sm btn-sm-success" onclick="quickApprove(${a.id})">✔️ تأیید</button>` : ''}
                </div>
            </div>
        `).join('');
    }

    async function updateStatus(id, status) {
        const res = await fetch(`/api/admin/appointments/${id}/status`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({status})
        });
        const result = await res.json();
        alert(result.message);
        loadAppointments();
    }

    async function quickApprove(id) {
        if (!confirm('آیا از تأیید این نوبت مطمئن هستید؟')) return;
        await updateStatus(id, 'confirmed');
    }

    // ====== کاربران ======
    async function loadUsers() {
        const res = await fetch('/api/admin/users');
        const data = await res.json();
        const div = document.getElementById('usersList');
        if (!data.users || data.users.length === 0) {
            div.innerHTML = '<p style="color:var(--m4cut-gray);text-align:center;padding:20px;">هیچ کاربری ثبت نشده است.</p>';
            return;
        }
        div.innerHTML = data.users.map(u => `
            <div class="user-item">
                <div>
                    <strong>${u.name}</strong> | 📞 ${u.phone || '---'} | 🆔 ${u.telegram_id}
                    ${u.is_admin === 1 ? '<span class="admin-badge">👑 ادمین</span>' : ''}
                </div>
                <div style="font-size:12px;color:var(--m4cut-gray);">
                    ${u.created_at ? new Date(u.created_at).toLocaleDateString('fa-IR') : ''}
                </div>
            </div>
        `).join('');
    }

    // ====== ساعات کاری ======
    let scheduleData = [];

    async function loadSchedule() {
        const res = await fetch('/api/admin/schedule');
        const data = await res.json();
        scheduleData = data.schedule;
        const div = document.getElementById('scheduleList');
        const days = ['شنبه', 'یکشنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنجشنبه', 'جمعه'];
        div.innerHTML = scheduleData.map(s => `
            <div class="schedule-item">
                <span class="day-name">${days[s.day_of_week]}</span>
                <input type="time" value="${s.start_time}" data-day="${s.day_of_week}" class="start-time">
                <span>تا</span>
                <input type="time" value="${s.end_time}" data-day="${s.day_of_week}" class="end-time">
                <label>
                    <input type="checkbox" ${s.is_active === 1 ? 'checked' : ''} data-day="${s.day_of_week}" class="active-check">
                    فعال
                </label>
            </div>
        `).join('');
    }

    document.getElementById('saveSchedule').addEventListener('click', async function() {
        const items = document.querySelectorAll('.schedule-item');
        const updates = [];
        items.forEach(item => {
            const day = parseInt(item.querySelector('.start-time').dataset.day);
            const start = item.querySelector('.start-time').value;
            const end = item.querySelector('.end-time').value;
            const active = item.querySelector('.active-check').checked ? 1 : 0;
            updates.push({ day_of_week: day, start_time: start, end_time: end, is_active: active });
        });
        for (const update of updates) {
            await fetch('/api/admin/schedule', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(update)
            });
        }
        alert('✅ ساعات کاری با موفقیت ذخیره شد!');
        loadSchedule();
    });

    // ====== اعلان همگانی ======
    document.getElementById('sendBroadcast').addEventListener('click', async function() {
        const message = document.getElementById('broadcastMessage').value.trim();
        if (!message) {
            alert('لطفاً متن پیام را وارد کنید.');
            return;
        }
        if (!confirm(`آیا از ارسال این پیام به همه کاربران مطمئن هستید؟\n\n${message}`)) return;
        const res = await fetch('/api/admin/broadcast', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({message})
        });
        const result = await res.json();
        document.getElementById('broadcastResult').innerHTML = `<div class="msg msg-success">✅ ${result.message}</div>`;
        document.getElementById('broadcastMessage').value = '';
    });

    // بارگیری اولیه
    loadAppointments();
</script>
</body>
</html>
