<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M4Cut - آرایشگاه تخصصی مردانه</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ... تمام استایل‌های قبلی ... */
        .webapp-note {
            background: rgba(212, 184, 124, 0.06);
            padding: 10px 16px;
            border-radius: 12px;
            margin: 10px 0;
            text-align: center;
            font-size: 13px;
            color: var(--luxe-text-muted);
            border: 1px solid var(--luxe-border);
        }
        .webapp-note strong {
            color: var(--luxe-gold);
        }
    </style>
</head>
<body>
<div class="container">
    <!-- ... هدر و محتوای قبلی ... -->

    <div class="webapp-note">
        🔹 این صفحه از طریق <strong>WebApp</strong> در تلگرام باز شده است.
        برای رزرو نوبت، روی دکمه زیر کلیک کنید.
    </div>

    <div class="support-box">
        📞 پشتیبانی و ارتباط با ادمین: <strong id="supportDisplay">@Tvpnred</strong>
    </div>

    <button class="btn-start" id="startBtn">🚀 شروع رزرو</button>
    <button onclick="Telegram.WebApp.close()" class="btn-start btn-close">❌ بستن</button>

    <div class="footer-note">M4Cut © 2026 • کلیه حقوق محفوظ است</div>
</div>

<script>
    // ====== دریافت شماره پشتیبانی از سرور ======
    async function loadSupport() {
        try {
            const res = await fetch('/api/admin/support');
            const data = await res.json();
            if (data.status === 'ok') {
                document.getElementById('supportDisplay').textContent = data.support_contact;
            }
        } catch(e) {
            console.error('Error loading support:', e);
        }
    }
    loadSupport();

    document.getElementById('startBtn').addEventListener('click', function() {
        const userStr = localStorage.getItem('user');
        if (userStr) {
            try {
                const user = JSON.parse(userStr);
                if (user && user.telegram_id) {
                    window.location.href = '/static/user.html';
                    return;
                }
            } catch(e) {}
        }
        window.location.href = '/static/index.html';
    });
</script>
</body>
</html>
